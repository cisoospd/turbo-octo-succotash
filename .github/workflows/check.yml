name: Verify Codespaces Locations

on:
  workflow_dispatch:

jobs:
  verify-locations:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          UNIQUE_LOCS=$(curl -s https://datacenters.microsoft.com/wp-json/globe/regions | jq -r '.[].id' | sort -u | grep -v '^$')
          
          echo "=== UNIQUE LOCATIONS FOUND ==="
          for L in $UNIQUE_LOCS; do
            echo "$L"
          done
          echo "=============================="
          
          for LOC in $UNIQUE_LOCS; do
            echo ">>> Testing location: $LOC"
            
            HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/codespaces/machines?location=$LOC")
              
            echo "HTTP Status Code: $HTTP_STATUS"
            echo "Response JSON:"
            cat response.json
            echo ""
            echo "----------------------------------------"
          done
